project:
  namespace: "org.simplemodeling.textus"
  id: "KnowledgeLake"
  name: "textus-knowledge-lake"
  title: "Textus Knowledge Lake"
  kind: car
  scalaPackage: "org.simplemodeling.textus.knowledgelake"
  component:
    name: "KnowledgeLake"
    className: "KnowledgeLakeComponent"
    displayName: "Textus Knowledge Lake"
    version: "0.1.0-SNAPSHOT"

build:
  scalaVersion: "3.3.8"
  cozyVersion: "0.3.3-SNAPSHOT"
  dependencies:
    compile:
      - "org.goldenport::goldenport-cncf:0.5.3-SNAPSHOT"
    test:
      - "org.scalatest::scalatest:3.2.19"
      - "org.scalatestplus::scalacheck-1-18:3.2.19.0"
      - "org.testcontainers:testcontainers-postgresql:2.0.5"

publication:
  source_manifest:
    enabled: false

packaging:
  kind: car
  car:
    abi:
      dependencies: []
    manifest_metadata:
      boundedContext: "knowledge-lake"
      domain: "knowledge"
    runtime:
      cncf:
        minimum: "0.5.3-SNAPSHOT"
        excluded: []
        tested:
          - "0.5.3-SNAPSHOT"

warehouse:
  repository_artifacts:
    include:
      - car
    modules:
      - "textus-knowledge-lake"
